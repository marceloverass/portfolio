site_name: Marcelo Veras
site_url: https://marceloverass.github.io/portfolio/

theme:
  name: material
  language: pt-BR
  favicon: assets/favicon.png
  logo: assets/3x4e.png
  palette: 
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Início: index.md
  - Projetos:
      - Desenvolvimento Web:
          - Portal GTI: projetos/portal-gti.md
      - Business Intelligence: 
          - NUPEC 360º: projetos/nupec-360.md
          - Desenrola Brasil: projetos/desenrola-brasil.md
      - Automação & Engenharia:
          - Relatório Gerencial: projetos/relatorio-gerencial.md
          - Meu Querido Diário: projetos/meu-querido-diario.md
      - DevOps & Cloud:
          - DevOps Deploy (AWS): projetos/devops-deploy.md


markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details

extra_css:
  - stylesheets/theme.css
  - stylesheets/lightbox.css

extra_javascript:
  - javascripts/lightbox.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marceloverass
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/marceloveras
    - icon: fontawesome/regular/envelope
      link: mailto:marceloantonino.verass@gmail.com

copyright: Copyright &copy; 2026 Marcelo Veras
